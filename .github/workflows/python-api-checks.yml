
name: Python API Checks

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/python-api-checks.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/python-api-checks.yml"
  workflow_dispatch:

jobs:
  check:
    name: Check Python API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Check Flask routes
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          health = client.get("/health")
          assert health.status_code == 200, health.data
          assert health.get_json()["status"] == "healthy"

          home = client.get("/")
          assert home.status_code == 200, home.data
          assert home.get_json()["name"] == "AWS Cloud Infrastructure Security Lab API"

          missing = client.get("/does-not-exist")
          assert missing.status_code == 404, missing.data

          print("API route checks passed.")
          PY

      - name: Build Docker image
        run: docker build -t aws-cloud-security-lab-api:latest .

      - name: Test Docker container
        run: |
          docker run -d --name api-test -p 5000:5000 aws-cloud-security-lab-api:latest
          trap 'docker logs api-test; docker rm -f api-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Container health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Container health check failed."
          exit 1
