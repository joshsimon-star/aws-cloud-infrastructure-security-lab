
name: Python API Checks

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/python-api-checks.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/python-api-checks.yml"
  workflow_dispatch:

jobs:
  check:
    name: Check Python API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Check Flask routes
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          health = client.get("/health")
          assert health.status_code == 200, health.data
          assert health.get_json()["status"] == "healthy"

          home = client.get("/")
          assert home.status_code == 200, home.data
          assert home.get_json()["name"] == "AWS Cloud Infrastructure Security Lab API"

          missing = client.get("/does-not-exist")
          assert missing.status_code == 404, missing.data

          print("API route checks passed.")
          PY
